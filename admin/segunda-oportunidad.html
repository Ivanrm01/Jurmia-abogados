<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Segunda oportunidad — JURMIA Abogados</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,300..600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #06365a; --tinta-oscura: #042439; --tinta-media: #35617f;
    --piedra: #c3ced2; --piedra-clara: #e6ebed; --papel: #f4f6f7;
    --verde: #1c6b4b; --ambar: #8a5a12; --rojo: #a12a2a;
    --linea: rgba(6,54,90,.16);
    --display: "Archivo", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--tinta-oscura);
         font-family: var(--display); font-size: 15px; line-height: 1.55; }
  a { color: var(--tinta); }

  .barra { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 1rem;
           justify-content: space-between; padding: .7rem 1.25rem; background: var(--tinta-oscura); color: #fff; }
  .barra-izq { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .barra img { height: 24px; }
  .barra-titulo { font-family: var(--mono); font-size: .7rem; letter-spacing: .16em;
                  text-transform: uppercase; color: var(--piedra); white-space: nowrap; }
  .barra-der { display: flex; align-items: center; gap: 1rem; font-size: .8125rem; color: var(--piedra); }

  .envoltura { max-width: 1240px; margin: 0 auto; padding: 1.25rem 1.25rem 5rem; }
  .oculto { display: none !important; }

  h1 { font-size: 1.5rem; margin: 0 0 .35rem; line-height: 1.2; }
  h2 { font-size: 1.0625rem; margin: 0 0 .2rem; }
  h3 { font-size: .9375rem; margin: 0 0 .5rem; }
  .rotulo { font-family: var(--mono); font-size: .6875rem; letter-spacing: .14em;
            text-transform: uppercase; color: var(--tinta-media); display: block; margin-bottom: .5rem; }
  .apunte { color: var(--tinta-media); font-size: .8125rem; margin: 0 0 1rem; }

  .caja { background: #fff; border: 1px solid var(--linea); padding: 1.25rem; margin-bottom: 1rem; }
  .caja-cabeza { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem 1rem; flex-wrap: wrap; margin-bottom: .85rem; }

  label, .etiqueta { display: block; font-family: var(--mono); font-size: .625rem; letter-spacing: .12em;
          text-transform: uppercase; color: var(--tinta-media); margin-bottom: .3rem; }
  input, select, textarea {
    width: 100%; font-family: var(--display); font-size: 16px; color: var(--tinta-oscura);
    background: var(--papel); border: 1px solid rgba(6,54,90,.2); padding: .55rem .65rem; border-radius: 2px;
  }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--tinta); padding: 0; }
  textarea { font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--tinta); outline-offset: -1px; background: #fff; }
  .campo { margin-bottom: .85rem; min-width: 0; }
  .campo small { display: block; color: var(--tinta-media); font-size: .75rem; margin-top: .25rem; line-height: 1.4; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 .85rem; }
  .rejilla .ancho { grid-column: 1 / -1; }
  .casilla-linea { display: flex; align-items: center; gap: .5rem; font-family: var(--display); font-size: .875rem;
                   letter-spacing: 0; text-transform: none; color: var(--tinta-oscura); margin: .4rem 0 .85rem; cursor: pointer; }

  button { font-family: var(--display); font-size: .875rem; font-weight: 600; cursor: pointer;
           padding: .6rem 1rem; border: 1px solid var(--tinta); background: var(--tinta); color: #fff;
           border-radius: 2px; min-height: 42px; }
  button:hover { background: #000; border-color: #000; }
  button:disabled { opacity: .5; cursor: default; }
  button.secundario { background: #fff; color: var(--tinta); }
  button.secundario:hover { background: var(--piedra-clara); border-color: var(--tinta); color: var(--tinta); }
  button.peligro { background: #fff; color: var(--rojo); border-color: var(--rojo); }
  button.peligro:hover { background: var(--rojo); color: #fff; }
  button.mini { min-height: 32px; padding: .3rem .6rem; font-size: .8125rem; }
  button.enlace { background: none; border: 0; color: var(--tinta); padding: 0; min-height: 0; font-weight: 600; text-decoration: underline; }
  .botonera { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th { font-family: var(--mono); font-size: .625rem; letter-spacing: .1em; text-transform: uppercase;
       color: var(--tinta-media); text-align: left; padding: .5rem .5rem; border-bottom: 1px solid rgba(6,54,90,.2); white-space: nowrap; }
  td { padding: .6rem .5rem; border-bottom: 1px solid rgba(6,54,90,.1); vertical-align: middle; }
  tr.fila:hover { background: var(--piedra-clara); cursor: pointer; }
  .num { font-family: var(--mono); white-space: nowrap; }
  .der { text-align: right; }
  .tenue { color: var(--tinta-media); font-size: .8125rem; }
  .tabla-scroll { overflow-x: auto; }

  .marca { font-family: var(--mono); font-size: .625rem; letter-spacing: .08em; text-transform: uppercase;
           padding: .2rem .45rem; border: 1px solid currentColor; white-space: nowrap; display: inline-block; line-height: 1.4; }
  .m-tinta { color: var(--tinta); } .m-ambar { color: var(--ambar); } .m-rojo { color: var(--rojo); }
  .m-verde { color: var(--verde); } .m-gris { color: var(--tinta-media); }
  .m-rojo.lleno { background: var(--rojo); color: #fff; border-color: var(--rojo); }
  .aviso.aviso-urgente { border-left-color: var(--rojo); margin: 0 0 1rem; }
  .aviso.aviso-urgente b { color: var(--rojo); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
          background: var(--linea); border: 1px solid var(--linea); margin-bottom: 1rem; }
  .kpi { background: #fff; padding: .75rem .85rem; text-align: left; border: 0; border-radius: 0; color: inherit;
         font-weight: 400; min-height: 0; display: block; }
  button.kpi:hover { background: var(--piedra-clara); color: inherit; }
  .kpi small { display: block; font-family: var(--mono); font-size: .5625rem; letter-spacing: .1em;
               text-transform: uppercase; color: var(--tinta-media); }
  .kpi b { display: block; font-family: var(--mono); font-size: 1.375rem; font-weight: 500; line-height: 1.3; }
  .kpi span { display: block; font-size: .75rem; color: var(--tinta-media); }
  .kpi.alerta b { color: var(--rojo); }

  .pestanas { display: flex; gap: .25rem; border-bottom: 1px solid var(--linea); margin-bottom: 1rem; overflow-x: auto; scrollbar-width: thin; }
  .pestanas button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--tinta-media);
                     border-radius: 0; padding: .6rem .8rem; white-space: nowrap; font-weight: 600; min-height: 44px; }
  .pestanas button:hover { color: var(--tinta); background: none; }
  .pestanas button[aria-selected="true"] { color: var(--tinta-oscura); border-bottom-color: var(--tinta); }
  .pestanas .cuenta { font-family: var(--mono); font-size: .6875rem; margin-left: .3rem; color: var(--tinta-media); }

  .cabeza-vista { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filtros { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .filtros select, .filtros input { width: auto; min-width: 150px; }
  .filtros input[type="search"] { flex: 1; min-width: 200px; }

  .dos-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
  .lista-atencion { list-style: none; margin: 0; padding: 0; }
  .lista-atencion li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .25rem .75rem; padding: .7rem 0;
                       border-bottom: 1px solid rgba(6,54,90,.1); cursor: pointer; }
  .lista-atencion li:hover { background: var(--piedra-clara); }
  .lista-atencion li:last-child { border-bottom: 0; }
  .lista-atencion b { font-size: .875rem; }
  .lista-atencion p { margin: 0; font-size: .8125rem; color: var(--tinta-media); }
  .grupo-atencion { margin-top: 1rem; }
  .grupo-atencion:first-child { margin-top: 0; }
  .vacio { color: var(--tinta-media); font-size: .8125rem; padding: .5rem 0; }

  .barras { display: grid; gap: .45rem; }
  .barra-fila { display: grid; grid-template-columns: 8.5rem 1fr 2.5rem; gap: .6rem; align-items: center; font-size: .8125rem; }
  .barra-fila i { display: block; height: 10px; background: var(--tinta); min-width: 2px; }
  .barra-fila .pista { background: var(--piedra-clara); height: 10px; }

  .seleccion { display: none; align-items: center; gap: .75rem; flex-wrap: wrap;
               background: #fbf1f1; border: 1px solid var(--rojo); padding: .6rem .85rem; margin-bottom: .75rem; }
  .seleccion.visible { display: flex; }
  .seleccion b { font-family: var(--mono); font-size: .8125rem; color: var(--rojo); }
  td.col-sel, th.col-sel { width: 34px; }

  .mensaje { font-family: var(--mono); font-size: .8125rem; padding: .6rem .8rem; margin-top: .8rem;
             border-left: 3px solid var(--tinta); background: var(--piedra-clara); }
  .mensaje.error { border-left-color: var(--rojo); background: #fbf1f1; color: var(--rojo); }
  .aviso { border-left: 3px solid var(--ambar); background: #fdf8ef; padding: .7rem .9rem; font-size: .8125rem; line-height: 1.55; margin: .85rem 0 0; }
  .aviso.ok { border-left-color: var(--verde); background: #f0f7f3; }
  .aviso.mal { border-left-color: var(--rojo); background: #fbf1f1; }
  .aviso b { display: block; margin-bottom: .15rem; }

  /* ficha */
  .ficha-cabeza { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: start; }
  .ficha-nombre { font-size: 1.6rem; line-height: 1.15; margin: 0; }
  .contacto-rapido { display: flex; flex-wrap: wrap; gap: .35rem 1rem; margin: .5rem 0 .6rem; font-size: .9375rem; }
  .contacto-rapido a { font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--linea); }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .ficha-mandos { display: grid; gap: .6rem; min-width: 220px; }
  .acciones-rapidas { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--linea); }
  .registro { margin-top: .85rem; background: var(--papel); border: 1px solid var(--linea); padding: .85rem; }

  .puntos { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
  .puntos li { display: grid; grid-template-columns: 1.2rem 1fr; gap: .45rem; font-size: .875rem; line-height: 1.45; }
  .puntos li::before { font-family: var(--mono); font-weight: 600; text-align: center; }
  .puntos li.ok::before { content: "✓"; color: var(--verde); }
  .puntos li.aviso::before { content: "!"; color: var(--ambar); }
  .puntos li.bloqueo::before { content: "×"; color: var(--rojo); }
  .respuestas { font-size: .8125rem; }
  .respuestas td { padding: .4rem .5rem .4rem 0; vertical-align: top; }
  .respuestas td:first-child { color: var(--tinta-media); width: 55%; }

  .docs-lista { list-style: none; margin: 0; padding: 0; }
  .docs-lista li { display: grid; grid-template-columns: minmax(0, 1fr) 175px; gap: .35rem .75rem; padding: .65rem 0; border-bottom: 1px solid rgba(6,54,90,.1); align-items: center; }
  .docs-lista li > div { min-width: 0; }
  .docs-lista input { grid-column: 1 / -1; font-size: 14px; padding: .4rem .55rem; }
  .docs-lista small { color: var(--tinta-media); font-size: .75rem; display: block; }
  .progreso { height: 6px; background: var(--piedra-clara); margin: .35rem 0 1rem; }
  .progreso i { display: block; height: 100%; background: var(--verde); }

  .pagos { min-width: 34rem; }
  .pagos td input, .pagos td select { font-size: 14px; padding: .35rem .45rem; }
  .pagos td:first-child { min-width: 9rem; }
  .pagos td { padding: .35rem .3rem; }

  .formulario-inline { background: var(--papel); border: 1px solid var(--linea); padding: 1rem; margin: .75rem 0; }

  .plazo-chip { font-family: var(--mono); font-size: .6875rem; white-space: nowrap; padding: .15rem .4rem; border: 1px solid currentColor; display: inline-block; }
  .plazo-chip.urgente { background: var(--rojo); color: #fff; border-color: var(--rojo); }
  .plazo-chip.pronto { color: var(--ambar); }
  .plazo-chip.lejos { color: var(--tinta-media); }

  .escritos-grupo { margin-bottom: 1.25rem; }
  .escritos-grupo:last-child { margin-bottom: 0; }
  .escrito-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem .75rem; align-items: center; padding: .75rem 0; border-bottom: 1px solid rgba(6,54,90,.1); }
  .escrito-fila:last-child { border-bottom: 0; }
  .escrito-fila p { margin: .1rem 0 0; font-size: .8125rem; color: var(--tinta-media); }
  .escrito-fila .botonera { justify-content: flex-end; }

  .computo { font-family: var(--mono); font-size: .75rem; display: flex; flex-wrap: wrap; gap: 2px; margin-top: .5rem; }
  .computo span { padding: .15rem .3rem; background: var(--piedra-clara); }
  .computo span.inhabil { background: transparent; color: var(--tinta-media); text-decoration: line-through; }
  details.detalle > summary { cursor: pointer; font-size: .8125rem; color: var(--tinta); margin-top: .35rem; }

  .historial { list-style: none; margin: 0; padding: 0; }
  .historial li { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: .75rem; padding: .55rem 0; border-bottom: 1px solid rgba(6,54,90,.1); font-size: .8125rem; }
  .historial .cuando { font-family: var(--mono); color: var(--tinta-media); font-size: .75rem; }

  .guardar-fijo { position: sticky; bottom: 0; z-index: 20; background: #fff; border-top: 2px solid var(--tinta);
                  padding: .7rem 1rem; display: flex; gap: .75rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
                  margin: 0 -1.25rem; box-shadow: 0 -8px 20px -12px rgba(4,36,57,.35); }
  .guardar-fijo span { font-size: .8125rem; color: var(--tinta-media); }

  /* editor de escritos */
  .editor { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
  .editor-lateral { position: sticky; top: 64px; display: grid; gap: 1rem; }
  .editor textarea#e-texto { min-height: 52vh; font-size: 13px; }
  .alternar { display: none; }
  .alternar button[aria-selected="true"] { background: var(--tinta); color: #fff; }
  .hoja { background: #fff; color: #1b1b1b; box-shadow: 0 1px 3px rgba(19,47,69,.12), 0 12px 32px -16px rgba(19,47,69,.3);
          border: 1px solid rgba(6,54,90,.1); padding: 3rem 3.5rem; font-family: "Times New Roman", Times, "Liberation Serif", Georgia, serif;
          font-size: 1rem; line-height: 1.7; max-width: 52rem; margin: 0 auto; }
  .hoja h3 { font-family: inherit; text-align: center; font-size: 1.02rem; letter-spacing: .02em; margin: 1.6rem 0 1rem; }
  .hoja h4 { font-family: inherit; font-size: .98rem; margin: 1.2rem 0 .5rem; }
  .hoja h3:first-child, .hoja h4:first-child { margin-top: 0; }
  .hoja p { margin: .6rem 0; text-align: justify; hyphens: auto; }
  .hoja p.derecha { text-align: right; }
  .hoja blockquote { margin: .8rem 2rem; padding-left: 1.2rem; border-left: 2px solid #ccd3d8; }
  .hoja ul { margin: .5rem 0; padding-left: 1.5rem; list-style: "– "; }
  .hoja li { margin-bottom: .35rem; text-align: justify; }
  .hoja table { font-family: var(--display); font-size: .78rem; line-height: 1.35; margin: 1rem 0; }
  .hoja th, .hoja td { border: 1px solid #c9d1d6; padding: .35rem .45rem; vertical-align: top; text-transform: none; letter-spacing: 0; font-size: .78rem; color: #1b1b1b; white-space: normal; }
  .hoja th { background: #e4eaee; font-family: var(--display); }
  .hoja mark { background: #fdf3df; color: var(--ambar); font-family: var(--display); font-size: .85em; font-weight: 600; padding: 0 .25rem; outline: 1px solid rgba(138,90,18,.3); }
  .huecos { list-style: none; margin: .5rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .35rem; }
  .huecos li button { font-family: var(--mono); font-size: .75rem; padding: .2rem .45rem; min-height: 0; background: #fdf3df; color: var(--ambar); border-color: rgba(138,90,18,.4); font-weight: 500; }
  .notas-letrado { margin: 0; padding-left: 1.1rem; font-size: .8125rem; line-height: 1.5; }
  .notas-letrado li { margin-bottom: .45rem; }

  @media (max-width: 1000px) {
    .dos-col, .editor { grid-template-columns: minmax(0, 1fr); }
    .editor-lateral { position: static; }
    .hoja { padding: 2rem 1.5rem; }
  }
  @media (max-width: 860px) {
    .barra { flex-wrap: wrap; gap: .5rem .75rem; padding: .6rem .9rem; }
    .barra-titulo { display: none; }
    .barra-der { margin-left: auto; min-width: 0; }
    #sesion-nombre { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ficha-cabeza { grid-template-columns: 1fr; }
    .editor.solo-texto .columna-hoja, .editor.solo-hoja .columna-texto { display: none; }
    .alternar { display: flex; }
  }
  @media (max-width: 720px) {
    .envoltura { padding: 1rem .9rem 5rem; }
    .guardar-fijo { margin: 0 -.9rem; }
    .tabla-lista table, .tabla-lista thead, .tabla-lista tbody, .tabla-lista tr, .tabla-lista td, .tabla-lista th { display: block; }
    .tabla-lista thead { display: none; }
    .tabla-lista tr.fila { border: 1px solid var(--linea); background: #fff; margin-bottom: .6rem; padding: .5rem .6rem; position: relative; }
    .tabla-lista td { border: 0; padding: .15rem 0; }
    .tabla-lista td[data-t]:not([data-t=""])::before { content: attr(data-t) " · "; font-family: var(--mono); font-size: .625rem; text-transform: uppercase; color: var(--tinta-media); }
    .tabla-lista td.col-sel { position: absolute; top: .55rem; right: .6rem; width: auto; }
    .historial li { grid-template-columns: 1fr; gap: .1rem; }
    .docs-lista li { grid-template-columns: 1fr; }
    .barra-fila { grid-template-columns: 6.5rem 1fr 2rem; }
    .hoja { padding: 1.25rem 1rem; font-size: .95rem; }
    .hoja p, .hoja li { text-align: left; }
    .hoja blockquote { margin: .8rem .5rem; }
  }

  /* --- raíl lateral de secciones: solo existe con sesión iniciada --- */
  body.identificado { padding-left: 76px; }
  .lateral { display: none; }
  body.identificado .lateral {
    position: fixed; left: 0; top: 0; bottom: 0; width: 76px; z-index: 45;
    background: var(--tinta-oscura); border-right: 1px solid rgba(255,255,255,.09);
    display: flex; flex-direction: column; align-items: center; gap: .3rem;
    padding: .7rem .35rem calc(.7rem + env(safe-area-inset-bottom, 0));
  }
  .lateral a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .22rem;
    width: 100%; padding: .55rem .2rem; border-radius: 6px; text-decoration: none;
    color: var(--piedra); opacity: .7; transition: background .15s ease, opacity .15s ease;
  }
  .lateral a:hover { background: rgba(255,255,255,.08); opacity: 1; }
  .lateral a.activa { background: rgba(255,255,255,.15); opacity: 1; color: #fff; }
  .lateral .ico { font-size: 1.3rem; line-height: 1; }
  .lateral .txt { font-family: var(--mono); font-size: .5625rem; letter-spacing: .07em; text-transform: uppercase; }
  @media (max-width: 760px) {
    body.identificado { padding-left: 58px; }
    body.identificado .lateral { width: 58px; }
    .lateral .txt { display: none; }
    .lateral .ico { font-size: 1.45rem; }
    .lateral a { padding: .7rem .2rem; }
  }

  /* --- pantalla de acceso, idéntica en todos los paneles --- */
  #acceso { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 1.5rem; }
  .tarjeta-acceso { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--linea); padding: 2.25rem 1.75rem; margin: 0; }
  .tarjeta-acceso img { width: 168px; height: auto; display: block; margin: 0 auto 1.75rem; }
  .tarjeta-acceso h1 { font-size: 1.25rem; margin: 0 0 .3rem; }
  .tarjeta-acceso p { color: var(--tinta-media); font-size: .875rem; margin: 0 0 1.5rem; }
